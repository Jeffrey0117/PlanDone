<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlanDone|一年計畫日記</title>
  <meta name="description" content="PlanDone — 2026-07 到 2027-06 的年曆規劃本">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=40">
</head>
<body>

  <div class="lock" id="lockOverlay" hidden>
    <form class="lock-box" id="lockForm">
      <h1>PlanDone</h1>
      <p>輸入通行碼開啟你的規劃本</p>
      <input type="password" id="lockInput" placeholder="通行碼" autocomplete="current-password" required>
      <button type="submit">開啟</button>
      <p class="lock-error" id="lockError" hidden>通行碼錯誤,再試一次</p>
    </form>
  </div>

  <header class="topbar">
    <div class="topbar-left">
      <a class="logo" href="#/">✓ PlanDone</a>
      <nav class="crumbs" id="crumbs"></nav>
    </div>
    <div class="topbar-right">
      <button class="chip save-state" id="saveState" hidden type="button"></button>
      <a class="chip chip-today" id="todayChip" href="#/"></a>
      <a class="chip chip-link" href="#/agenda">行程</a>
      <a class="chip chip-link" href="#/week">本週</a>
      <a class="chip chip-link" href="#/vocab">單字</a>
      <span class="chip chip-streak" id="streakChip" hidden></span>
      <span class="chip" id="todayLeft" hidden></span>
      <button class="gear" id="settingsBtn" aria-label="設定" title="設定">⚙</button>
    </div>
  </header>

  <div class="modal" id="settingsModal" hidden>
    <div class="modal-box">
      <h2>設定</h2>
      <p class="set-title">顯示哪些元素</p>
      <div class="set-toggles" id="featureToggles"></div>
      <p class="set-title">每日印章(點日子蓋章,蓋滿一個月很爽)</p>
      <div class="stamp-list" id="stampList"></div>
      <form class="stamp-add" id="stampAddForm">
        <input id="stampEmoji" placeholder="💪" maxlength="4" size="3">
        <input id="stampName" placeholder="章名(如:健身)" maxlength="12">
        <button type="submit">新增</button>
      </form>
      <button class="modal-close" id="settingsClose">完成</button>
    </div>
  </div>

  <div class="year-progress">
    <div class="yp-row">
      <span class="yp-edge" id="ypStart"></span>
      <div class="yp-track">
        <div class="yp-fill" id="ypFill">
          <svg class="yp-buddy" viewBox="0 0 28 28" aria-hidden="true">
            <circle cx="14" cy="14" r="12" fill="#ffe8b3" stroke="#3a3630" stroke-width="1.6"/>
            <circle cx="9.5" cy="12.5" r="1.6" fill="#3a3630"/>
            <circle cx="18.5" cy="12.5" r="1.6" fill="#3a3630"/>
            <path d="M10.5 17.5 Q14 20.5 17.5 17.5" stroke="#3a3630" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            <circle cx="7" cy="16" r="1.8" fill="#f5b7ad" opacity=".8"/>
            <circle cx="21" cy="16" r="1.8" fill="#f5b7ad" opacity=".8"/>
          </svg>
        </div>
      </div>
      <span class="yp-edge" id="ypEnd"></span>
    </div>
    <p class="yp-caption" id="ypCaption"></p>
  </div>

  <div class="modal" id="dayModal" hidden>
    <div class="modal-box day-modal-box" id="dayModalBox"></div>
  </div>

  <main id="view" class="view"></main>

  <p class="savebar" id="saveBar" hidden>已儲存 ✓</p>

  <script src="app.js?v=31"></script>
</body>
</html>
