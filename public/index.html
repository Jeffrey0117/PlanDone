<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlanDone|一年計畫日記</title>
  <meta name="description" content="PlanDone — 2026-07 到 2027-06 的年曆規劃本">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <div class="lock" id="lockOverlay" hidden>
    <form class="lock-box" id="lockForm">
      <h1>PlanDone</h1>
      <p>輸入通行碼開啟你的規劃本</p>
      <input type="password" id="lockInput" placeholder="通行碼" autocomplete="current-password" required>
      <button type="submit">開啟</button>
      <p class="lock-error" id="lockError" hidden>通行碼錯誤,再試一次</p>
    </form>
  </div>

  <header class="topbar">
    <a class="logo" href="#/">✓ PlanDone</a>
    <span class="topbar-range">2026.07 — 2027.06</span>
  </header>

  <div class="year-progress">
    <div class="yp-row">
      <span class="yp-edge">JUL '26</span>
      <div class="yp-track">
        <div class="yp-fill" id="ypFill">
          <svg class="yp-buddy" viewBox="0 0 28 28" aria-hidden="true">
            <circle cx="14" cy="14" r="12" fill="#ffe8b3" stroke="#3a3630" stroke-width="1.6"/>
            <circle cx="9.5" cy="12.5" r="1.6" fill="#3a3630"/>
            <circle cx="18.5" cy="12.5" r="1.6" fill="#3a3630"/>
            <path d="M10.5 17.5 Q14 20.5 17.5 17.5" stroke="#3a3630" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            <circle cx="7" cy="16" r="1.8" fill="#f5b7ad" opacity=".8"/>
            <circle cx="21" cy="16" r="1.8" fill="#f5b7ad" opacity=".8"/>
          </svg>
        </div>
      </div>
      <span class="yp-edge">JUN '27</span>
    </div>
    <p class="yp-caption" id="ypCaption"></p>
  </div>

  <main id="view" class="view"></main>

  <p class="savebar" id="saveBar" hidden>已儲存 ✓</p>

  <script src="app.js?v=3"></script>
</body>
</html>
